repos:
  - repo: local
    hooks:
      - id: just-format
        name: just format
        description: Format src/ with clang-format and restage the result
        entry: bash -c 'just format && git add -u src'
        language: system
        files: ^src/.*\.(cpp|hpp)$
        pass_filenames: false
        stages: [pre-commit]

