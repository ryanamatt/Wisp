# Starship prompt
#
# Requires: Nerd Fonts (any complete variant, e.g. JetBrainsMono Nerd Font)
# Install : This is a matugen template -- point config.toml at it, matugen
#           writes the rendered result to ~/.config/starship.toml

# --- Prompt layout ---
# Line 1:  [glyph] [os]  [directory]  [git_branch] [git_status]
#          [language runtimes ...]
# Line 2:  [time]  [status/character]

format = """
$os\
$username\
$hostname\
[  ](fg:surface_alt)\
$directory\
[](fg:surface_alt bg:surface)\
$git_branch\
$git_status\
[](fg:surface bg:none)\
$fill\
$python\
$nodejs\
$rust\
$golang\
$java\
$lua\
$package\
$cmd_duration\
$line_break\
$time\
$status\
$character"""

# --- Palette ---
# Names follow Material Design roles rather than any one theme's mood,
# so this stays meaningful no matter which wallpaper generated it.
palette = "dynamic"

[palettes.dynamic]
background           = "{{ colors.background.default.hex }}"              # page background
background_alt        = "{{ colors.surface_container.default.hex }}"       # background, one step up
surface                = "{{ colors.surface.default.hex }}"                 # segment background
surface_alt            = "{{ colors.surface_container_high.default.hex }}"  # segment background, elevated
secondary              = "{{ colors.secondary.default.hex }}"               # secondary accent
secondary_container    = "{{ colors.secondary_container.default.hex }}"     # secondary accent, lighter tone
foreground              = "{{ colors.on_background.default.hex }}"          # primary text
primary                 = "{{ colors.primary.default.hex }}"                # main accent
tertiary                = "{{ colors.tertiary.default.hex }}"               # secondary highlight
warning                 = "{{ colors.warning.default.hex }}"
muted                   = "{{ colors.outline.default.hex }}"                # low-emphasis text
muted_variant           = "{{ colors.outline_variant.default.hex }}"        # low-emphasis text, softer
error                   = "{{ colors.error.default.hex }}"
success                 = "{{ colors.success.default.hex }}"
info                    = "{{ colors.info.default.hex }}"

# --- OS / entry glyph ---
[os]
format = "[$symbol]($style) "
style = "bold fg:primary"
disabled = false

[os.symbols]
Arch        = "󰣇"
Unknown     = "󰬯"

# --- Username ---
[username]
format = "[$user]($style)"
style_user = "bold fg:secondary_container"
style_root = "bold fg:error"
show_always = false

# --- Hostname ---
[hostname]
format = "[@$hostname]($style) "
style = "fg:muted_variant"
ssh_only = true

# --- Directory ---
[directory]
format = "[ 󰉋 $path ]($style)[$read_only]($read_only_style)"
style = "bold fg:foreground bg:surface_alt"
read_only = " 󰌾 "
read_only_style = "fg:error bg:surface_alt"
truncation_length = 4
truncation_symbol = "󰇘 "
home_symbol = "󱂵 ~"

[directory.substitutions]
"Documents" = "󰈙 Docs"
"Downloads" = " DL"
"Music"     = "󰝚 Music"
"Pictures"  = "󰋩 Pics"
"Videos"    = "󰕧 Vids"
"Desktop"   = "󰟀 Desktop"
".config"   = "󱁿 cfg"
".local"    = "󰮂 local"
"src"       = "󰅩 src"
"projects"  = "󰏗 projects"

# --- Git Branch ---
[git_branch]
format = "[ $symbol$branch(:$remote_branch) ]($style)"
symbol = "󰘬 "
style = "bold fg:tertiary bg:surface"
truncation_length = 24
truncation_symbol = "󰇘"

# --- Git Status ---
[git_status]
format = "[$all_status$ahead_behind]($style)"
style = "fg:warning bg:surface"
conflicted  = " 󱗃 "
ahead       = " ⇡${count}"
behind      = " ⇣${count}"
diverged    = " 󰹺 ⇡${ahead_count}⇣${behind_count}"
untracked   = " 󰐗${count}"
stashed     = " 󰏗 "
modified    = " 󰝶${count}"
staged      = " 󰸞${count}"
renamed     = " 󰑕${count}"
deleted     = " 󰩺${count}"

# --- Fill (right-align runtimes) ---
[fill]
symbol = " "
style = "fg:background"

# --- Language runtimes ---
[python]
format = "[ $symbol$version ]($style)"
symbol = "󰌠 "
style = "fg:secondary"
version_format = "v${major}.${minor}"

[nodejs]
format = "[ $symbol$version ]($style)"
symbol = " "
style = "fg:success"
version_format = "v${major}.${minor}"

[rust]
format = "[ $symbol$version ]($style)"
symbol = "󱘗 "
style = "fg:secondary_container"
version_format = "v${major}.${minor}"

[golang]
format = "[ $symbol$version ]($style)"
symbol = "󰟓 "
style = "fg:info"
version_format = "v${major}.${minor}"

[java]
format = "[ $symbol$version ]($style)"
symbol = "󰬷 "
style = "fg:warning"
version_format = "v${major}.${minor}"

[lua]
format = "[ $symbol$version ]($style)"
symbol = "󰢱 "
style = "fg:secondary"
version_format = "v${major}.${minor}"

[package]
format = "[ 󰏗 $version ]($style)"
style = "fg:muted"
version_format = "v${raw}"

# --- Command duration ---
[cmd_duration]
format = "[ 󱞩 $duration ]($style)"
style = "fg:muted_variant"
min_time = 2_000
show_milliseconds = false

# --- Time (second line, left) ---
[time]
format = "[󱑃 $time ]($style)"
style = "fg:muted_variant"
time_format = "%H:%M"
disabled = false

# --- Exit status ---
[status]
format = "[$symbol$status ]($style)"
symbol = "✗ "
success_symbol = ""    # hidden on success
not_executable_symbol = "󰌾 "
not_found_symbol = "󰩺 "
sigint_symbol = "󰆐 "
style = "bold fg:error"
map_symbol = true
disabled = false

# --- Prompt character ---
[character]
format = "$symbol "
success_symbol = "[❯](bold fg:primary)"
error_symbol   = "[❯](bold fg:error)"
vimcmd_symbol  = "[❮](bold fg:tertiary)"
