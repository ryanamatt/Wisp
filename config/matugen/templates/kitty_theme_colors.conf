# --- 16-color terminal palette ---
# Semantic mapping (kept regardless of theme): red = error, green = success,
# yellow = warning, cyan = info, magenta = primary accent, blue = secondary
# accent. Bright variants (8-15) are the same hue lightened -- black/white
# reuse existing surface/foreground roles instead, since those already read
# correctly as "dim" and "bright" without needing a filter.

# black
color0   {{ colors.background.default.hex }}
color8   {{ colors.surface_container_high.default.hex }}

# red -- error
color1   {{ colors.error.default.hex }}
color9   {{ colors.error.default.hex | lighten: 12 }}

# green -- success
color2   {{ colors.success.default.hex }}
color10  {{ colors.success.default.hex | lighten: 12 }}

# yellow -- warning
color3   {{ colors.warning.default.hex }}
color11  {{ colors.warning.default.hex | lighten: 12 }}

# blue -- secondary accent
color4   {{ colors.secondary.default.hex }}
color12  {{ colors.secondary.default.hex | lighten: 12 }}

# magenta -- primary accent
color5   {{ colors.primary.default.hex }}
color13  {{ colors.primary.default.hex | lighten: 12 }}

# cyan -- info
color6   {{ colors.info.default.hex }}
color14  {{ colors.info.default.hex | lighten: 12 }}

# white
color7   {{ colors.on_surface_variant.default.hex }}
color15  {{ colors.on_background.default.hex }}