# config/matugen/config.toml

[config]

[config.custom_colors]
success = { color = "#6fbf73", blend = true }
warning = { color = "#c9a24a", blend = true }
info    = { color = "#a8d8e0", blend = true }
ember   = { color = "#d9884a", blend = true }
purple  = { color = "#9c6ade", blend = true }
blue    = { color = "#4a90d9", blend = true }
cyan    = { color = "#4dd0e1", blend = true }
teal    = { color = "#26a69a", blend = true }
green   = { color = "#5cb85c", blend = true }
lime    = { color = "#b0d94e", blend = true }
yellow  = { color = "#e6c34d", blend = true }
orange  = { color = "#e2984a", blend = true }
red     = { color = "#d9534f", blend = true }
pink    = { color = "#e07fa8", blend = true }
magenta = { color = "#c454c4", blend = true }
indigo  = { color = "#6272c4", blend = true }

[templates.quickshell_colors]
input_path = '~/Projects/wisp/config/matugen/templates/wisp-colors.json'
output_path = '~/.config/wisp/colors.json'

[templates.starship]
input_path = '~/Projects/wisp/config/matugen/templates/starship.toml'
output_path = '~/.config/starship.toml'

[templates.kitty]
input_path = '~/Projects/wisp/config/matugen/templates/kitty_theme_colors.conf'
output_path = '~/.config/kitty/theme_colors.conf'
post_hook = 'kill -SIGUSR1 $(pgrep kitty)'

[templates.fish]
input_path = '~/Projects/wisp/config/matugen/templates/fish-colors.fish'
output_path = '~/.config/fish/conf.d/fish-colors.fish'

[templates.hyprland]
input_path = '~/Projects/wisp/config/matugen/templates/hyprland-colors.lua'
output_path = '~/.config/hypr/modules/colors.lua'
post_hook = 'hyprctl reload'

[templates.swaync]
input_path = '~/Projects/wisp/config/matugen/templates/swaync_theme_colors.css'
output_path = '~/.config/swaync/colors/theme_colors.css'
post_hook = 'swaync-client --reload-css'
